<section class="featureSection">
    <div class="featureSectionHeader">
        <h2>Loved by watercolor artists</h2>
        <p>Proof, not promises.</p>
    </div>
    <div class="features">
        {% for feature in site.features %}

        {% if feature.title %}
        <div class="feature">
            <div class="featureText">
                <h3>
                    {{ feature.title }}
                </h3>
                <p>
                    {{ feature.description }}
                </p>
            </div>
        </div>
        {% endif %}

        {% endfor %}
    </div>
</section>
