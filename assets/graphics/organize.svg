      <line x1="8" y1="12" x2="28" y2="12" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="22" x2="28" y2="22" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
      <circle cx="52" cy="52" r="32" fill="#b8c4d4"/>
    </g>
    <g transform="translate(578, 372)">
      <rect x="-8" y="-8" width="120" height="120" rx="20" fill="#fff" stroke="rgba(0,0,0,0.06)"/>
      <line x1="8" y1="12" x2="28" y2="12" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="22" x2="28" y2="22" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
      <circle cx="52" cy="52" r="32" fill="#4a3728"/>
    </g>
    <g transform="translate(714, 372)">
      <rect x="-8" y="-8" width="120" height="120" rx="20" fill="#fff" stroke="rgba(0,0,0,0.06)"/>
      <line x1="8" y1="12" x2="28" y2="12" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="22" x2="28" y2="22" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
      <circle cx="52" cy="52" r="32" fill="#f0e6d8"/>
