  <!-- Focus on active well -->
  <circle cx="630" cy="284" r="58" fill="none" stroke="#1d63ea" stroke-width="3" stroke-dasharray="10 8" opacity="0.8"/>
  <circle cx="630" cy="284" r="7" fill="#1d63ea"/>
  <text x="600" y="590" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1d63ea">Drag to reorder</text>
</svg>
