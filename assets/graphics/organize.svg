<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="orgTitle">
  <title id="orgTitle">Stylized palette layout with draggable wells in Smarty Paints</title>
  <defs>
    <linearGradient id="orgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f6fc"/>
      <stop offset="100%" stop-color="#e8eef8"/>
    </linearGradient>
    <filter id="orgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#1d63ea" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#orgBg)"/>
  <g filter="url(#orgShadow)">
    <rect x="220" y="80" width="760" height="740" rx="36" fill="#ffffff" stroke="rgba(29,99,234,0.12)" stroke-width="2"/>
  </g>
  <text x="288" y="154" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1a1d24">My palette</text>
  <text x="820" y="152" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#8b93a1">12 paints</text>
  <!-- Palette surface -->
  <rect x="260" y="180" width="680" height="520" rx="24" fill="#f7f9fd" stroke="rgba(29,99,234,0.1)" stroke-width="2"/>
  <text x="288" y="218" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#8b93a1" letter-spacing="0.06em">DRAG TO REORDER</text>
  <!-- Row 1 wells -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g>
      <rect x="288" y="248" width="168" height="120" rx="20" fill="#ffffff" stroke="rgba(0,0,0,0.08)"/>
      <text x="304" y="272" font-size="13" font-weight="700" fill="#5c6370">&#8801;</text>
      <circle cx="352" cy="312" r="28" fill="#c45c3a"/>
      <text x="304" y="356" font-size="12" font-weight="700" fill="#1a1d24">Vermilion</text>
    </g>
    <g>
      <rect x="476" y="248" width="168" height="120" rx="20" fill="#ffffff" stroke="rgba(0,0,0,0.08)"/>
      <text x="492" y="272" font-size="13" font-weight="700" fill="#5c6370">&#8801;</text>
      <circle cx="540" cy="312" r="28" fill="#e8b84a"/>
      <text x="492" y="356" font-size="12" font-weight="700" fill="#1a1d24">Yellow ochre</text>
    </g>
    <g>
      <rect x="664" y="248" width="168" height="120" rx="20" fill="#ffffff" stroke="#1d63ea" stroke-width="3"/>
      <text x="680" y="272" font-size="13" font-weight="700" fill="#1d63ea">&#8801;</text>
      <circle cx="728" cy="312" r="28" fill="#1e5f8a"/>
      <text x="680" y="356" font-size="12" font-weight="700" fill="#1a1d24">Prussian</text>
    </g>
    <g>
      <rect x="852" y="248" width="168" height="120" rx="20" fill="#ffffff" stroke="rgba(0,0,0,0.08)"/>
      <text x="868" y="272" font-size="13" font-weight="700" fill="#5c6370">&#8801;</text>
      <circle cx="916" cy="312" r="28" fill="#2a8f5c"/>
      <text x="868" y="356" font-size="12" font-weight="700" fill="#1a1d24">Sap green</text>
    </g>
  </g>
  <!-- Row 2 -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g>
      <rect x="288" y="392" width="168" height="120" rx="20" fill="#ffffff" stroke="rgba(0,0,0,0.08)"/>
      <text x="304" y="416" font-size="13" font-weight="700" fill="#5c6370">&#8801;</text>
      <circle cx="352" cy="456" r="28" fill="#6b4fa3"/>
      <text x="304" y="500" font-size="12" font-weight="700" fill="#1a1d24">Dioxazine</text>
    </g>
    <g>
      <rect x="476" y="392" width="168" height="120" rx="20" fill="#ffffff" stroke="rgba(0,0,0,0.08)"/>
      <text x="492" y="416" font-size="13" font-weight="700" fill="#5c6370">&#8801;</text>
      <circle cx="540" cy="456" r="28" fill="#b8c4d4"/>
      <text x="492" y="500" font-size="12" font-weight="700" fill="#1a1d24">Neutral tint</text>
    </g>
    <g>
      <rect x="664" y="392" width="168" height="120" rx="20" fill="#ffffff" stroke="rgba(0,0,0,0.08)"/>
      <text x="680" y="416" font-size="13" font-weight="700" fill="#5c6370">&#8801;</text>
      <circle cx="728" cy="456" r="28" fill="#4a3728"/>
      <text x="680" y="500" font-size="12" font-weight="700" fill="#1a1d24">Burnt sienna</text>
    </g>
    <g>
      <rect x="852" y="392" width="168" height="120" rx="20" fill="#ffffff" stroke="rgba(0,0,0,0.08)"/>
      <text x="868" y="416" font-size="13" font-weight="700" fill="#5c6370">&#8801;</text>
      <circle cx="916" cy="456" r="28" fill="#f0e6d8"/>
      <text x="868" y="500" font-size="12" font-weight="700" fill="#1a1d24">Titanium</text>
    </g>
  </g>
  <!-- Hand pointing at Prussian well (proportional to discover.svg) -->
  <ellipse cx="618" cy="278" rx="36" ry="18" fill="#1d63ea" opacity="0.14"/>
  <g transform="translate(538, 222) scale(0.36)" stroke="#1a1d24" stroke-width="3" fill="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 88c-12-8-10-28 4-36l18-10c8-4 18-2 24 4l6 8"/>
    <path d="M30 54l22-48c6-12 22-16 34-10s16 22 10 34l-18 38"/>
    <path d="M52 46l8-36c4-14 20-22 34-18s22 18 18 32l-12 40"/>
    <path d="M78 44l4-28c2-12 16-20 28-16s18 16 16 28l-6 32"/>
    <path d="M12 88c-4 18 8 36 26 40h32l48-4c10-2 18-10 20-20l8-36"/>
  </g>
</svg>
