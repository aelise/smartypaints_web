<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t2">
  <title id="t2">Explainer: drag wells to match your real palette</title>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede8ff"/>
      <stop offset="55%" stop-color="#f4f6ff"/>
      <stop offset="100%" stop-color="#e8f0ff"/>
    </linearGradient>
    <filter id="sh2" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#1d63ea" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg2)"/>
  <g filter="url(#sh2)">
    <rect x="230" y="72" width="740" height="756" rx="40" fill="#ffffff" stroke="rgba(29,99,234,0.11)" stroke-width="2"/>
  </g>
  <text x="278" y="138" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#1c1f28">My palette</text>
  <text x="868" y="134" text-anchor="end" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#8b92a3">12 paints</text>
  <!-- Palette tray: 2 rows x 4 -->
  <rect x="278" y="168" width="644" height="380" rx="28" fill="#f5f7fc" stroke="rgba(29,99,234,0.08)" stroke-width="2"/>
  <text x="306" y="206" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#8b92a3" letter-spacing="0.12em">REORDER</text>
  <g id="wells">
    <g transform="translate(306, 232)">
      <rect x="-8" y="-8" width="120" height="120" rx="20" fill="#fff" stroke="rgba(0,0,0,0.06)"/>
      <line x1="8" y1="12" x2="28" y2="12" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="22" x2="28" y2="22" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
      <circle cx="52" cy="52" r="32" fill="#c45c3a"/>
    </g>
    <g transform="translate(442, 232)">
      <rect x="-8" y="-8" width="120" height="120" rx="20" fill="#fff" stroke="rgba(0,0,0,0.06)"/>
      <line x1="8" y1="12" x2="28" y2="12" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="22" x2="28" y2="22" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
      <circle cx="52" cy="52" r="32" fill="#e8b84a"/>
