<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t3">
  <title id="t3">Explainer: match a class paint to what you own</title>
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede8ff"/>
      <stop offset="55%" stop-color="#f4f6ff"/>
      <stop offset="100%" stop-color="#e8f0ff"/>
    </linearGradient>
    <filter id="sh3" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#1d63ea" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg3)"/>
  <g filter="url(#sh3)">
    <rect x="230" y="72" width="740" height="756" rx="40" fill="#ffffff" stroke="rgba(29,99,234,0.11)" stroke-width="2"/>
  </g>
  <text x="278" y="138" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#1c1f28">Match for class</text>
  <!-- Two columns -->
  <rect x="278" y="178" width="260" height="340" rx="24" fill="#fafbff" stroke="rgba(0,0,0,0.05)"/>
  <text x="298" y="214" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#8b92a3" letter-spacing="0.14em">CLASS USES</text>
  <circle cx="408" cy="320" r="72" fill="#c45c3a"/>
  <text x="298" y="430" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#1c1f28">Pyrrol scarlet</text>
  <text x="298" y="454" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#8b92a3">Daniel Smith</text>
  <rect x="662" y="178" width="260" height="340" rx="24" fill="#fafbff" stroke="rgba(0,0,0,0.05)"/>
  <text x="682" y="214" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#8b92a3" letter-spacing="0.14em">YOU HAVE</text>
  <circle cx="792" cy="320" r="72" fill="#d14a38"/>
  <text x="682" y="430" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#1c1f28">Naphthol red</text>
  <text x="682" y="454" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#8b92a3">W&amp;N</text>
  <!-- Arrow -->
  <path d="M558 320 L642 320" stroke="#1d63ea" stroke-width="5" stroke-linecap="round"/>
  <polygon points="628,308 652,320 628,332" fill="#1d63ea"/>
  <text x="560" y="302" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#1d63ea" letter-spacing="0.06em">CLOSE MATCH</text>
  <!-- Status -->
  <rect x="278" y="552" width="644" height="72" rx="22" fill="#f5f7fc" stroke="rgba(29,99,234,0.1)" stroke-width="2"/>
  <text x="302" y="588" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#8b92a3" letter-spacing="0.1em">STATUS</text>
  <rect x="392" y="568" width="72" height="40" rx="20" fill="#eef0f6"/>
  <text x="428" y="594" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#6b7280">Own</text>
  <rect x="476" y="568" width="88" height="40" rx="20" fill="#1d63ea"/>
  <text x="520" y="594" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#fff">Dupe</text>
  <rect x="576" y="568" width="88" height="40" rx="20" fill="#eef0f6"/>
  <text x="620" y="594" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#6b7280">Need</text>
  <text x="688" y="594" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#6b7280">~94% match</text>
  <!-- Tap cue on Dupe -->
  <ellipse cx="520" cy="588" rx="56" ry="28" fill="#1d63ea" opacity="0.1"/>
  <circle cx="520" cy="576" r="9" fill="#1d63ea"/>
  <path d="M520 532 L520 500" stroke="#1d63ea" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
</svg>
