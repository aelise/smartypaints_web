<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="psTitle">
  <title id="psTitle">Tutorial match and dupe status in Smarty Paints</title>
  <defs>
    <linearGradient id="psBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f6fc"/>
      <stop offset="100%" stop-color="#e8eef8"/>
    </linearGradient>
    <filter id="psShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#1d63ea" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#psBg)"/>
  <g filter="url(#psShadow)">
    <rect x="220" y="80" width="760" height="740" rx="36" fill="#ffffff" stroke="rgba(29,99,234,0.12)" stroke-width="2"/>
  </g>
  <text x="288" y="154" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1a1d24">Match for class</text>
  <!-- Left: tutorial asks -->
  <rect x="260" y="190" width="300" height="280" rx="20" fill="#fafbfe" stroke="rgba(0,0,0,0.06)"/>
  <text x="288" y="224" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#8b93a1" letter-spacing="0.08em">VIDEO USES</text>
  <circle cx="360" cy="300" r="40" fill="#c45c3a"/>
  <text x="288" y="380" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#1a1d24">Pyrrol scarlet</text>
  <text x="288" y="404" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#8b93a1">Daniel Smith</text>
  <!-- Connector -->
  <path d="M580 330 L640 330" stroke="#1d63ea" stroke-width="4" stroke-linecap="round"/>
  <polygon points="632,318 660,330 632,342" fill="#1d63ea"/>
  <text x="588" y="312" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1d63ea">CLOSE MATCH</text>
  <!-- Right: your stash -->
  <rect x="640" y="190" width="300" height="280" rx="20" fill="#fafbfe" stroke="rgba(0,0,0,0.06)"/>
  <text x="668" y="224" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#8b93a1" letter-spacing="0.08em">YOU HAVE</text>
  <circle cx="790" cy="300" r="40" fill="#d14a38"/>
  <text x="668" y="380" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#1a1d24">Naphthol red</text>
  <text x="668" y="404" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#8b93a1">Winsor &amp; Newton</text>
  <!-- Status row -->
  <rect x="260" y="510" width="680" height="64" rx="18" fill="#f7f9fd" stroke="rgba(29,99,234,0.12)"/>
  <text x="288" y="540" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#8b93a1" letter-spacing="0.06em">STATUS</text>
  <rect x="380" y="522" width="76" height="40" rx="20" fill="#eef2f9"/>
  <text x="418" y="548" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#5c6370">Own</text>
  <rect x="472" y="522" width="88" height="40" rx="20" fill="#1d63ea"/>
  <text x="516" y="548" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Dupe</text>
  <rect x="576" y="522" width="88" height="40" rx="20" fill="#eef2f9"/>
  <text x="620" y="548" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#5c6370">Need</text>
  <text x="700" y="548" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#5c6370">Property match ~94%</text>
  <!-- Hand toward status row -->
  <ellipse cx="498" cy="592" rx="36" ry="18" fill="#1d63ea" opacity="0.14"/>
  <g transform="translate(408, 532) scale(0.38)" stroke="#1a1d24" stroke-width="3" fill="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 88c-12-8-10-28 4-36l18-10c8-4 18-2 24 4l6 8"/>
    <path d="M30 54l22-48c6-12 22-16 34-10s16 22 10 34l-18 38"/>
    <path d="M52 46l8-36c4-14 20-22 34-18s22 18 18 32l-12 40"/>
    <path d="M78 44l4-28c2-12 16-20 28-16s18 16 16 28l-6 32"/>
    <path d="M12 88c-4 18 8 36 26 40h32l48-4c10-2 18-10 20-20l8-36"/>
  </g>
</svg>
