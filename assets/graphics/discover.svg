<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t">
  <title id="t">Explainer: search and browse paints in Smarty Paints</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede8ff"/>
      <stop offset="55%" stop-color="#f4f6ff"/>
      <stop offset="100%" stop-color="#e8f0ff"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#1d63ea" flood-opacity="0.09"/>
    </filter>
    <linearGradient id="sw1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2a4a6e"/><stop offset="100%" stop-color="#1a3355"/></linearGradient>
    <linearGradient id="sw2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#5a8fd4"/><stop offset="100%" stop-color="#3d6eb8"/></linearGradient>
    <linearGradient id="sw3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4a6fa8"/><stop offset="100%" stop-color="#2d5080"/></linearGradient>
    <linearGradient id="sw4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8eb8e8"/><stop offset="100%" stop-color="#6a9fd4"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <!-- App panel -->
  <g filter="url(#sh)">
    <rect x="230" y="72" width="740" height="756" rx="40" fill="#ffffff" stroke="rgba(29,99,234,0.11)" stroke-width="2"/>
  </g>
  <!-- Top bar -->
  <text x="278" y="138" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#1c1f28">Paints</text>
  <rect x="720" y="108" width="200" height="40" rx="20" fill="#e8f0ff"/>
  <text x="820" y="134" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1d63ea">All brands</text>
  <!-- Search -->
  <rect x="278" y="168" width="644" height="58" rx="29" fill="#fff" stroke="#1d63ea" stroke-width="2.5"/>
  <circle cx="314" cy="197" r="11" fill="none" stroke="#1d63ea" stroke-width="2.5"/>
  <line x1="322" y1="205" x2="332" y2="215" stroke="#1d63ea" stroke-width="2.5" stroke-linecap="round"/>
  <text x="352" y="206" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600" fill="#3a4150">Prussian blue…</text>
  <!-- Chips -->
  <rect x="278" y="248" width="96" height="36" rx="18" fill="#1d63ea"/>
  <text x="326" y="272" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fff">Pigment</text>
  <rect x="386" y="248" width="82" height="36" rx="18" fill="#f0f2f8" stroke="rgba(0,0,0,0.06)"/>
  <text x="427" y="272" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#6b7280">Brand</text>
  <rect x="480" y="248" width="90" height="36" rx="18" fill="#f0f2f8" stroke="rgba(0,0,0,0.06)"/>
  <text x="525" y="272" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#6b7280">Series</text>
  <!-- 2x2 cards: big swatches, short labels -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="278" y="312" width="300" height="168" rx="22" fill="#fafbff" stroke="rgba(0,0,0,0.05)"/>
    <rect x="298" y="332" width="120" height="88" rx="16" fill="url(#sw1)"/>
    <text x="298" y="452" font-size="16" font-weight="800" fill="#1c1f28">Prussian</text>
    <text x="298" y="472" font-size="12" font-weight="600" fill="#8b92a3">PB27</text>
    <rect x="598" y="312" width="300" height="168" rx="22" fill="#fafbff" stroke="rgba(0,0,0,0.05)"/>
    <rect x="618" y="332" width="120" height="88" rx="16" fill="url(#sw2)"/>
    <text x="618" y="452" font-size="16" font-weight="800" fill="#1c1f28">Phthalo</text>
    <text x="618" y="472" font-size="12" font-weight="600" fill="#8b92a3">PB15</text>
    <rect x="278" y="498" width="300" height="168" rx="22" fill="#fafbff" stroke="rgba(0,0,0,0.05)"/>
    <rect x="298" y="518" width="120" height="88" rx="16" fill="url(#sw3)"/>
    <text x="298" y="638" font-size="16" font-weight="800" fill="#1c1f28">Indigo</text>
    <rect x="598" y="498" width="300" height="168" rx="22" fill="#fafbff" stroke="#1d63ea" stroke-width="3"/>
    <rect x="618" y="518" width="120" height="88" rx="16" fill="url(#sw4)"/>
    <text x="618" y="638" font-size="16" font-weight="800" fill="#1c1f28">Cerulean</text>
    <text x="618" y="658" font-size="12" font-weight="600" fill="#8b92a3">PB35</text>
  </g>
  <!-- Focus: pick from results -->
  <rect x="586" y="486" width="324" height="192" rx="26" fill="none" stroke="#1d63ea" stroke-width="3" stroke-dasharray="12 10" opacity="0.85"/>
  <circle cx="618" cy="518" r="7" fill="#1d63ea"/>
  <text x="618" y="702" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1d63ea">Pick a result</text>
</svg>
